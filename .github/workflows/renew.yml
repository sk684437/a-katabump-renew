name: Katabump Auto Renew

on:
  schedule:
  - cron: '2 2 * * *'  # 每天 UTC 0点 (北京时间 8点) 运行,根据服务到期时间自行修改
  workflow_dispatch: # 允许手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: write  # 🚨 需要写权限才能将时间更新推送到 README
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1 # 只需要拉取最新提交

    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

    - name: 🚀 运行续期脚本
      env:
        # 多账号模式（可选）：格式：email1:pass1,email2:pass2
        # 若未设置此 Secret，脚本自动回退到单账号模式（KATABUMP_EMAIL + KATABUMP_PASSWORD）
        KATABUMP_ACCOUNTS: ${{ secrets.KATABUMP_ACCOUNTS }}
        # 单账号模式（保留兼容）
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        # Telegram 通知
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 账号间延迟（可选，默认15秒）
        ACCOUNT_DELAY: ${{ secrets.ACCOUNT_DELAY }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py
        
    - name: 📝 更新 README 时间 (防止 Action 休眠)
      if: always() # 无论前面成功还是失败，都执行此步保活
      run: |
        # 设置 Git 机器人身份
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 确保 README 存在，防止报错
        touch README.md
        
        # 删除旧的运行时间记录（通过匹配特定前缀删除整行）
        sed -i '/^> 🕒 最后运行时间:/d' README.md
        
        # 获取当前北京时间并追加到末尾
        CURRENT_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
        echo "> 🕒 最后运行时间: $CURRENT_TIME" >> README.md
        
        # 提交并推送到仓库
        git add README.md
        # 如果有更改则提交，跳过 CI 触发，防止无限循环
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 更新自动运行时间保活 [skip ci]" && git push)

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
        count=0
        for run_id in $runs; do
          count=$((count + 1))
          if [ $count -gt 1 ]; then
            echo "删除运行记录: $run_id"
            gh run delete $run_id || true
          fi
        done
